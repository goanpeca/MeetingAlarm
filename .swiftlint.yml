# SwiftLint configuration. Golden rules encoded mechanically — see
# docs/principles/golden-principles.md.
included:
  - Sources
  - Tests
excluded:
  - .build

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 100
  error: 140

# Golden rule: files stay small. Outgrowing this means the file does too much.
file_length:
  warning: 250
  error: 400

type_body_length:
  warning: 200
  error: 350

function_body_length:
  warning: 50
  error: 100

identifier_name:
  min_length: 2
  excluded: [id, r, g, b, a, x, y, ok, to]

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^A-Za-z0-9_.])print\s*\('
    message: "Use os.Logger, not print(). See docs/principles/golden-principles.md."
    severity: error
    match_kinds:
      - identifier
