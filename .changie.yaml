changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
# Keep a Changelog shape: bracketed version, em-dash date, "### Kind", dash bullets.
versionFormat: '## [{{.Version}}] — {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
    - label: Added
      auto: minor
    - label: Changed
      auto: minor
    - label: Fixed
      auto: patch
    - label: Removed
      auto: minor
    - label: Security
      auto: patch
newlines:
    afterChangelogHeader: 1
    beforeChangelogVersion: 0
    beforeKind: 1
    afterKind: 1
    endOfVersion: 1
envPrefix: CHANGIE_
